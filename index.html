<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Web太鼓風リズムゲーム</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1c:wght@700;900&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'M PLUS Rounded 1c', sans-serif;
            background-color: #ffe4e1; /* パステルピンク背景 */
            background-image: radial-gradient(#ffb6c1 20%, transparent 20%), radial-gradient(#ffb6c1 20%, transparent 20%);
            background-size: 40px 40px;
            background-position: 0 0, 20px 20px;
            overflow: hidden;
            touch-action: none; /* スマホでのスクロール防止 */
        }

        .game-container {
            box-shadow: 0 10px 25px rgba(0,0,0,0.2);
            border: 8px solid #ff69b4; /* ホットピンクのフチ */
            border-radius: 20px;
            background: #fff;
            position: relative;
        }

        canvas {
            border-radius: 12px;
            background: linear-gradient(180deg, #ffe4e1 0%, #ffc0cb 100%);
            display: block;
            width: 100%;
        }

        .score-board {
            text-shadow: 2px 2px 0 #fff, -2px -2px 0 #fff, 2px -2px 0 #fff, -2px 2px 0 #fff;
        }

        /* 判定テキストのアニメーション用 */
        @keyframes pop {
            0% { transform: scale(0.5); opacity: 0; }
            50% { transform: scale(1.2); opacity: 1; }
            100% { transform: scale(1); opacity: 0; }
        }
        
        .judgment {
            position: absolute;
            left: 20%;
            top: 20%;
            font-size: 3rem;
            font-weight: 900;
            opacity: 0;
            pointer-events: none;
        }
        
        .judge-perfect { color: #facc15; text-shadow: 0 0 10px #eab308, 2px 2px 0 #000; }
        .judge-good { color: #fff; text-shadow: 0 0 10px #ccc, 2px 2px 0 #000; }
        .judge-miss { color: #3b82f6; text-shadow: 0 0 10px #2563eb, 2px 2px 0 #000; }

        .btn-play {
            background: linear-gradient(45deg, #ff69b4, #ff1493); /* ピンクのボタン */
            box-shadow: 0 6px 0 #c71585, 0 10px 10px rgba(0,0,0,0.3);
            transition: all 0.1s;
        }
        .btn-play:active {
            transform: translateY(6px);
            box-shadow: 0 0px 0 #c71585, 0 4px 4px rgba(0,0,0,0.3);
        }

        .drum-pad {
            touch-action: manipulation;
        }
    </style>
</head>
<body class="h-screen w-screen flex flex-col items-center justify-center text-gray-800">

    <!-- Header / Score -->
    <div class="w-full max-w-4xl px-4 flex justify-between items-end mb-2 score-board">
        <div class="text-4xl font-black text-pink-500 flex items-center gap-2">
            🍑 からぴち風リズムゲーム
        </div>
        <div class="text-right">
            <div class="text-xl font-bold text-gray-600">コンボ <span id="comboDisplay" class="text-3xl text-red-500">0</span></div>
            <div class="text-2xl font-black text-gray-800">スコア: <span id="scoreDisplay">0</span></div>
        </div>
    </div>

    <!-- Game Area -->
    <div class="w-full max-w-4xl px-4 relative">
        <div class="game-container w-full p-2 relative">
            <canvas id="gameCanvas" width="1000" height="250"></canvas>
            
            <!-- 判定エフェクト用DOM -->
            <div id="judgeText" class="judgment z-10">良</div>

            <!-- Start / Result Overlay -->
            <div id="overlay" class="absolute inset-0 bg-white/80 rounded-[12px] flex flex-col items-center justify-center z-20 backdrop-blur-sm">
                <h1 id="overlayTitle" class="text-5xl font-black text-pink-500 mb-6 drop-shadow-md">カラフルに叩け！</h1>
                <p id="overlayDesc" class="text-gray-800 text-lg mb-8 bg-white/70 border-2 border-pink-300 p-4 rounded-lg text-center font-bold">
                    【PC操作】<br>
                    ドン（じゃぱぱ/赤）: <span class="text-red-500">F</span> または <span class="text-red-500">J</span> キー<br>
                    カ（のあ/ピンク）: <span class="text-pink-500">D</span> または <span class="text-pink-500">K</span> キー<br><br>
                    【スマホ操作】<br>
                    画面下のボタンをタップ！
                </p>
                <button id="startBtn" class="btn-play text-white font-bold text-2xl py-4 px-12 rounded-full cursor-pointer">
                    ゲームスタート
                </button>
            </div>
        </div>
    </div>

    <!-- Mobile Touch Controls -->
    <div class="w-full max-w-4xl px-4 mt-6 flex justify-center gap-4 sm:hidden">
        <button id="btnKaLeft" class="drum-pad w-24 h-24 rounded-full bg-pink-400 border-4 border-pink-600 shadow-[0_8px_0_#be185d] active:translate-y-2 active:shadow-none text-white font-bold text-lg leading-tight">のあ<br>(カ)</button>
        <div class="flex gap-2">
            <button id="btnDonLeft" class="drum-pad w-24 h-24 rounded-full bg-red-500 border-4 border-red-700 shadow-[0_8px_0_#b91c1c] active:translate-y-2 active:shadow-none text-white font-bold text-lg leading-tight">じゃぱぱ<br>(ドン)</button>
            <button id="btnDonRight" class="drum-pad w-24 h-24 rounded-full bg-red-500 border-4 border-red-700 shadow-[0_8px_0_#b91c1c] active:translate-y-2 active:shadow-none text-white font-bold text-lg leading-tight">じゃぱぱ<br>(ドン)</button>
        </div>
        <button id="btnKaRight" class="drum-pad w-24 h-24 rounded-full bg-pink-400 border-4 border-pink-600 shadow-[0_8px_0_#be185d] active:translate-y-2 active:shadow-none text-white font-bold text-lg leading-tight">のあ<br>(カ)</button>
    </div>

    <!-- PC Key Guide -->
    <div class="hidden sm:flex max-w-4xl w-full justify-center gap-8 mt-6 text-gray-500 font-bold">
        <div class="flex items-center gap-2"><div class="w-8 h-8 rounded bg-pink-100 border-2 border-pink-300 flex items-center justify-center text-pink-600">D</div>のあ (カ)</div>
        <div class="flex items-center gap-2"><div class="w-8 h-8 rounded bg-red-100 border-2 border-red-300 flex items-center justify-center text-red-600">F</div>じゃぱぱ (ドン)</div>
        <div class="flex items-center gap-2"><div class="w-8 h-8 rounded bg-red-100 border-2 border-red-300 flex items-center justify-center text-red-600">J</div>じゃぱぱ (ドン)</div>
        <div class="flex items-center gap-2"><div class="w-8 h-8 rounded bg-pink-100 border-2 border-pink-300 flex items-center justify-center text-pink-600">K</div>のあ (カ)</div>
    </div>

<script>
    /**
     * Web Audio APIを使用したシンプルなシンセサイザー
     */
    let audioCtx = null;

    function initAudio() {
        if (!audioCtx) {
            audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        }
        if (audioCtx.state === 'suspended') {
            audioCtx.resume();
        }
    }

    function playSound(type) {
        if (!audioCtx) return;
        
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.connect(gain);
        gain.connect(audioCtx.destination);

        const now = audioCtx.currentTime;

        if (type === 'don') {
            // ドン（太鼓の面・低音）
            osc.type = 'sine';
            osc.frequency.setValueAtTime(250, now);
            osc.frequency.exponentialRampToValueAtTime(40, now + 0.15);
            gain.gain.setValueAtTime(1, now);
            gain.gain.exponentialRampToValueAtTime(0.01, now + 0.15);
            osc.start(now);
            osc.stop(now + 0.15);
        } else if (type === 'ka') {
            // カ（太鼓のふち・高音）
            osc.type = 'square';
            osc.frequency.setValueAtTime(600, now);
            osc.frequency.exponentialRampToValueAtTime(200, now + 0.05);
            
            // ノイズを少し足してアタック感を出すためのハイパスフィルタっぽく
            const osc2 = audioCtx.createOscillator();
            osc2.type = 'triangle';
            osc2.frequency.setValueAtTime(800, now);
            osc2.connect(gain);
            osc2.start(now);
            osc2.stop(now + 0.05);

            gain.gain.setValueAtTime(0.6, now);
            gain.gain.exponentialRampToValueAtTime(0.01, now + 0.05);
            osc.start(now);
            osc.stop(now + 0.05);
        }
    }

    /**
     * ゲームシステム
     */
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');
    const scoreDisplay = document.getElementById('scoreDisplay');
    const comboDisplay = document.getElementById('comboDisplay');
    const judgeText = document.getElementById('judgeText');
    const overlay = document.getElementById('overlay');
    const startBtn = document.getElementById('startBtn');
    const overlayTitle = document.getElementById('overlayTitle');
    const overlayDesc = document.getElementById('overlayDesc');

    // ゲーム定数
    const TARGET_X = 180; // 判定枠のX座標
    const HIT_RADIUS = 35; // 音符の半径
    const NOTE_SPEED = 0.5; // px per ms (1秒間に500px進む)
    const JUDGE_PERFECT = 40; // ms 判定幅
    const JUDGE_GOOD = 80;
    
    // ゲーム状態
    let isPlaying = false;
    let score = 0;
    let combo = 0;
    let startTime = 0;
    let notes = [];
    let animationId = null;
    let hitEffectTime = 0;
    let hitEffectColor = '';

    // 譜面データ生成 (ランダムなBPM120風のリズムを60秒分生成)
    function generateBeatmap() {
        const newNotes = [];
        let currentTime = 2000; // 最初は2秒待つ
        const duration = 40000; // 40秒間
        
        while (currentTime < duration) {
            // BPM 120 = 1拍 500ms
            const step = Math.random() > 0.7 ? 250 : 500; // 8分音符 or 4分音符
            const type = Math.random() > 0.6 ? 'ka' : 'don';
            
            newNotes.push({
                time: currentTime,
                type: type,
                hit: false,
                missed: false
            });
            currentTime += step;
        }
        return newNotes;
    }

    function startGame() {
        initAudio();
        isPlaying = true;
        score = 0;
        combo = 0;
        updateUI();
        notes = generateBeatmap();
        startTime = performance.now();
        overlay.classList.add('hidden');
        
        if (animationId) cancelAnimationFrame(animationId);
        gameLoop();
    }

    function stopGame() {
        isPlaying = false;
        overlayTitle.innerText = "ゲームクリア！";
        overlayDesc.innerHTML = `最終スコア: <span class="font-bold text-yellow-300 text-3xl">${score}</span><br>最大コンボ: <span class="font-bold text-white">${combo}</span>`;
        startBtn.innerText = "もう一度遊ぶ";
        overlay.classList.remove('hidden');
    }

    function updateUI() {
        scoreDisplay.innerText = score;
        comboDisplay.innerText = combo;
        if (combo >= 10) {
            comboDisplay.classList.add('text-orange-500', 'animate-pulse');
        } else {
            comboDisplay.classList.remove('text-orange-500', 'animate-pulse');
        }
    }

    function showJudgment(text, type) {
        judgeText.innerText = text;
        judgeText.className = `judgment ${type}`;
        // アニメーションをリセットして再トリガー
        judgeText.style.animation = 'none';
        void judgeText.offsetWidth; // リフロー強制
        judgeText.style.animation = 'pop 0.5s ease-out forwards';
    }

    function handleInput(inputType) {
        if (!isPlaying) return;
        
        playSound(inputType);
        
        const now = performance.now() - startTime;
        
        // 判定エフェクト
        hitEffectTime = performance.now();
        hitEffectColor = inputType === 'don' ? 'rgba(239, 68, 68, 0.4)' : 'rgba(59, 130, 246, 0.4)';

        // 判定処理（未処理の音符のうち一番近いものを探す）
        const upcomingNotes = notes.filter(n => !n.hit && !n.missed);
        if (upcomingNotes.length === 0) return;

        const targetNote = upcomingNotes[0];
        const timeDiff = Math.abs(targetNote.time - now);

        // 判定範囲内かチェック
        if (timeDiff <= JUDGE_GOOD) {
            // 種類が合っているか
            if (targetNote.type === inputType) {
                targetNote.hit = true;
                
                if (timeDiff <= JUDGE_PERFECT) {
                    // 良 (Perfect)
                    score += 300 + (combo > 10 ? 100 : 0);
                    combo++;
                    showJudgment('良', 'judge-perfect');
                } else {
                    // 可 (Good)
                    score += 100;
                    combo++;
                    showJudgment('可', 'judge-good');
                }
            } else {
                // 種類間違いは不可扱いにする場合とスルーする場合があるが、今回はミスにする
                targetNote.missed = true;
                combo = 0;
                showJudgment('不可', 'judge-miss');
            }
            updateUI();
        }
    }

    // メイン描画ループ
    function gameLoop(timestamp) {
        if (!isPlaying) return;
        
        const now = performance.now() - startTime;
        ctx.clearRect(0, 0, canvas.width, canvas.height);

        // レーン背景描画
        ctx.fillStyle = '#fff5f7';
        ctx.fillRect(0, canvas.height/2 - 50, canvas.width, 100);
        ctx.strokeStyle = '#fbcfe8';
        ctx.lineWidth = 2;
        ctx.beginPath();
        ctx.moveTo(0, canvas.height/2);
        ctx.lineTo(canvas.width, canvas.height/2);
        ctx.stroke();

        // 判定枠描画
        ctx.beginPath();
        ctx.arc(TARGET_X, canvas.height/2, HIT_RADIUS, 0, Math.PI * 2);
        ctx.fillStyle = '#fce7f3';
        ctx.fill();
        ctx.strokeStyle = '#f472b6';
        ctx.lineWidth = 4;
        ctx.stroke();

        // 叩いた時のエフェクト
        if (performance.now() - hitEffectTime < 150) {
            ctx.beginPath();
            ctx.arc(TARGET_X, canvas.height/2, HIT_RADIUS + 15, 0, Math.PI * 2);
            ctx.fillStyle = hitEffectColor;
            ctx.fill();
        }

        // 音符描画
        let allProcessed = true;
        
        for (let i = 0; i < notes.length; i++) {
            const note = notes[i];
            
            if (note.hit || note.missed) continue;
            allProcessed = false;

            const timeDiff = note.time - now;
            const x = TARGET_X + (timeDiff * NOTE_SPEED);

            // ミス判定 (通り過ぎた)
            if (timeDiff < -JUDGE_GOOD) {
                note.missed = true;
                combo = 0;
                updateUI();
                showJudgment('不可', 'judge-miss');
                continue;
            }

            // 画面内にある場合のみ描画
            if (x < canvas.width + HIT_RADIUS && x > -HIT_RADIUS) {
                ctx.beginPath();
                ctx.arc(x, canvas.height/2, HIT_RADIUS, 0, Math.PI * 2);
                
                if (note.type === 'don') {
                    ctx.fillStyle = '#ef4444'; // 赤（じゃぱぱ）
                    ctx.fill();
                    ctx.strokeStyle = '#fff';
                    ctx.lineWidth = 3;
                    ctx.stroke();
                    // 内側の文字（恐竜）
                    ctx.fillStyle = '#fff';
                    ctx.font = 'bold 28px "M PLUS Rounded 1c"';
                    ctx.textAlign = 'center';
                    ctx.textBaseline = 'middle';
                    ctx.fillText('🦖', x, canvas.height/2 + 2);
                } else {
                    ctx.fillStyle = '#f472b6'; // ピンク（のあ）
                    ctx.fill();
                    ctx.strokeStyle = '#fff';
                    ctx.lineWidth = 3;
                    ctx.stroke();
                    // 内側の文字（クッキー）
                    ctx.fillStyle = '#fff';
                    ctx.font = 'bold 28px "M PLUS Rounded 1c"';
                    ctx.textAlign = 'center';
                    ctx.textBaseline = 'middle';
                    ctx.fillText('🍪', x, canvas.height/2 + 2);
                }
            }
        }

        if (allProcessed && notes.length > 0) {
            setTimeout(stopGame, 1000); // 最後の音符処理後、1秒後にクリア画面
        } else {
            animationId = requestAnimationFrame(gameLoop);
        }
    }

    // イベントリスナー
    startBtn.addEventListener('click', startGame);

    // PCキーボード操作
    window.addEventListener('keydown', (e) => {
        if (e.repeat) return;
        const key = e.key.toLowerCase();
        
        if (key === 'f' || key === 'j') {
            handleInput('don');
        } else if (key === 'd' || key === 'k') {
            handleInput('ka');
        } else if (key === ' ' && !isPlaying) {
            // スペースキーでスタート
            startGame();
        }
    });

    // スマホタッチ操作 (prevent default to avoid zooming/scrolling on double tap)
    const bindTouch = (id, type) => {
        const el = document.getElementById(id);
        el.addEventListener('touchstart', (e) => {
            e.preventDefault();
            handleInput(type);
        });
        // マウスクリックも対応（PCデバッグ用）
        el.addEventListener('mousedown', (e) => {
            e.preventDefault();
            handleInput(type);
        });
    }

    bindTouch('btnDonLeft', 'don');
    bindTouch('btnDonRight', 'don');
    bindTouch('btnKaLeft', 'ka');
    bindTouch('btnKaRight', 'ka');

</script>
</body>
</html>
